secret_number_mission:
  description: "A cooperative mission to find a secret number N between 1 and 100."
  nb_actions: 2
  rules: "The goal is to guess the number N. The score is 100 minus the number of turns. To guess, an agent must perform the action 'guess' with the parameter 'number'. Example: {\"action\": \"interact_env\", \"env_action\": \"guess\", \"params\": {\"number\": 50}}."
  initial_info:
    - target_agent_id: "A"
      info: "The secret number N is even."
    - target_agent_id: "B"
      info: "The secret number N is greater than 80."

loup_garou:
  description: "Werewolf Game (8 agents) with roles and day/night cycle."
  nb_actions: 2
  rules: |
    The game alternates between NIGHT and DAY. Objectives:
      - Village wins: all Werewolves are eliminated.
      - Werewolves win: Werewolves are in majority (>= number of remaining villagers).
    Roles (example): 2 Werewolves, 1 Seer, 1 Witch, 1 Cupid, 3 Villagers.
    Actions (via {"action":"interact_env"}):
      Night:
        * Werewolf: {"env_action":"kill", "params":{"target":"<ID>"}}
        * Seer: {"env_action":"inspect", "params":{"target":"<ID>"}}
        * Witch: {"env_action":"save"} OR {"env_action":"poison", "params":{"target":"<ID>"}} (once each)
        * Cupid (1st night only): {"env_action":"propose_couple", "params":{"a":"<ID>", "b":"<ID>"}}
      Day:
        * All: {"env_action":"vote", "params":{"target":"<ID>"}}
    Resolutions:
      - Night: if a target is chosen by wolves and not saved, they die.
      - Day: the person with the most votes is eliminated (tie: nobody eliminated).
  roles:
    A: "Werewolf"
    B: "Werewolf"
    C: "Seer"
    D: "Witch"
    E: "Cupid"
    F: "Villager"
    G: "Villager"
    H: "Villager"
  initial_info:
    - target_agent_id: "A"
      info: "You are a Werewolf. The other wolf is: B. Cooperate at night to choose a target."
    - target_agent_id: "B"
      info: "You are a Werewolf. The other wolf is: A. Cooperate at night to choose a target."
    - target_agent_id: "C"
      info: "You are the Seer. Each night, you can inspect a player to know their role."
    - target_agent_id: "D"
      info: "You are the Witch. You have a life potion (save) and a death potion (poison), each usable once."
    - target_agent_id: "E"
      info: "You are Cupid. On the first night, link two players as a couple (propose_couple)."
    - target_agent_id: "F"
      info: "You are a Villager. Observe, discuss, and vote during the day."
    - target_agent_id: "G"
      info: "You are a Villager. Observe, discuss, and vote during the day."
    - target_agent_id: "H"
      info: "You are a Villager. Observe, discuss, and vote during the day."
debate:
  description: "A high-stakes debate simulation where agents argue to reach consensus (3 out of 4 agree) or split."
  nb_actions: 2
  rules: |
    DEBATE RULES:
    - Goal: Reach consensus (3+ out of 4 agents agree) via voting
    - Timeline: You have 8 STEPS to debate, then MANDATORY VOTING
    - Each step: Send 1-2 SHORT, FORCEFUL messages OR change opinion OR vote
    
    Available Actions (via {"action":"interact_env"}):
      * Message: {"env_action":"message", "params":{"target_agent_id":"<ID>", "message":"<concise argument>"}}
        - Max 2 messages per step
        - Must be specific, evidence-based arguments
      * Change opinion: {"env_action":"change_opinion", "params":{"shift":<-1.0 to 1.0>}}
      * Vote: {"env_action":"vote", "params":{"vote":"for|against|abstain"}}
    
    CONSENSUS RULES:
      - When 3 out of 4 agents agree → DEBATE ENDS immediately
      - After step 8 → ALL agents MUST vote immediately
      - 75% "for" votes = consensus reached
      - Relationship weights affect message impact (0.5x to 1.5x)
      - Argument strength multiplies impact (0.5x to 1.5x)
  
  questions:
    - topic: "Should we prioritize economic growth or environmental protection?"
      initial_opinions:
        A: 0.8
        B: 0.3
        C: -0.6
        D: -0.2
    
    - topic: "Is artificial intelligence a threat to humanity?"
      initial_opinions:
        A: -0.7
        B: 0.2
        C: -0.5
        D: 0.4
    
    - topic: "Should universal basic income be implemented?"
      initial_opinions:
        A: -0.6
        B: 0.5
        C: 0.8
        D: 0.1
    
    - topic: "Should we invest heavily in space exploration?"
      initial_opinions:
        A: 0.7
        B: -0.3
        C: -0.8
        D: 0.2
  
  relationships:
    A:
      B: "respects but skeptical of"
      C: "dislikes for idealism"
      D: "trusts for balance"
    B:
      A: "appreciates pragmatism"
      C: "finds passionate"
      D: "agrees with often"
    C:
      A: "distrusts capitalist views"
      B: "sees as ally"
      D: "admires common ground"
    D:
      A: "respects expertise"
      B: "agrees partially with"
      C: "sympathizes with passion"
  
  initial_info:
    - target_agent_id: "A"
      info: "AGGRESSIVE GROWTH ADVOCATE. You believe in national competitiveness and technological advancement. You are dismissive of environmental concerns as \"alarmism\". You're stubborn and actively dislike C's ideology. Attack weakly-reasoned positions. Demand concrete counter-evidence."
    - target_agent_id: "B"
      info: "PRAGMATIC MEDIATOR. You see merit in BOTH sides. You're the swing vote. You're swayed by EVIDENCE and LOGIC, not emotions. You respect both A's expertise and C's principles when backed by data. You actively DISLIKE vague statements."
    - target_agent_id: "C"
      info: "PASSIONATE ENVIRONMENTAL DEFENDER. You're deeply committed to climate action. You believe space exploration is wasteful when Earth faces existential threats. You DISTRUST A's motives. You're idealistic but respect B's pragmatism and D's balance-seeking."
    - target_agent_id: "D"
      info: "PRAGMATIC ANALYST seeking real solutions. You RESPECT A's expertise but challenge oversimplification. You ADMIRE C's passion but want evidence, not ideology. You value BOTH progress AND conservation. You ask hard questions."

task_cooperation:
  description: "A collaborative project where agents work together to complete tasks with different skill requirements."
  nb_actions: 3
  rules: |
    Goal: Complete all project tasks before time runs out (10 steps).
    Each task requires a certain effort level to be completed.
    
    Available Actions (via {"action":"interact_env"}):
      * Assign to task: {"env_action":"assign_to_task", "params":{"task_id":"<ID>"}}
      * Contribute: {"env_action":"contribute", "params":{"task_id":"<ID>", "effort":<points>, "skill_bonus":<1.0-2.0>}}
      * Request help: {"env_action":"request_help", "params":{"task_id":"<ID>", "skill_type":"<type>"}}
      * Complete task: {"env_action":"complete_task", "params":{"task_id":"<ID>"}}
    
    Mechanics:
      - Effort points accumulate towards task completion
      - Skill bonus multiplies effort (e.g., 10 effort * 1.5 bonus = 15 points)
      - Multiple agents can work on the same task
      - Tasks must be completed before deadline
  tasks:
    - id: "design"
      name: "System Design"
      required_effort: 100
      required_skill: "architect"
    - id: "backend"
      name: "Backend Development"
      required_effort: 150
      required_skill: "backend"
    - id: "frontend"
      name: "Frontend Development"
      required_effort: 120
      required_skill: "frontend"
    - id: "testing"
      name: "Testing & QA"
      required_effort: 80
      required_skill: "qa"
  initial_info:
    - target_agent_id: "A"
      info: "You are an Architect. Your skill bonus is 1.5x on design tasks, 1.0x on others. Lead the project design phase."
    - target_agent_id: "B"
      info: "You are a Backend Developer. Your skill bonus is 1.5x on backend tasks, 1.0x on others. Focus on infrastructure."
    - target_agent_id: "C"
      info: "You are a Frontend Developer. Your skill bonus is 1.5x on frontend tasks, 1.0x on others. Build the UI."
    - target_agent_id: "D"
      info: "You are a QA Engineer. Your skill bonus is 1.5x on testing tasks, 1.0x on others. Ensure code quality."